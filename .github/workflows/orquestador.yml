name: Orquestador cada 4h - Producción

# REACTIVADO 2026-08-10: el muro "negative_traffic" en /gz/account-verification
# que forzó la pausa del 2026-08-09 ya no está activo (confirmado en vivo).
# Antes de reactivar se corrigió la causa de fondo del incidente: un mismatch
# de canonical/og:url ya no se interpreta como "el aviso fue eliminado" de
# inmediato - ahora se detecta aparte si el sitio está redirigiendo TODO el
# tráfico al muro (resultado "bloqueado" en scrapers_base/02_scraper_detalle.py),
# lo que corta la corrida sin tocar estado_publicacion, y el resto de los
# mismatches pasan por el contador intentos_fallidos_detalle en vez de
# marcarse de inmediato (ver 02_scraper_detalle_incremental.py). Si el sitio
# vuelve a bloquear, esto ya no debería poder vaciar la base de nuevo.
# PAUSADO 2026-10-17: el proyecto se deja en pausa para enfocarse en otros
# trabajos. La última corrida que trajo datos fue la #401 del 2026-09-30; desde
# entonces Portal Inmobiliario devuelve páginas vacías a las IPs de datacenter
# de GitHub Actions. No es un 403 ni un CAPTCHA -que el scraper sí detectaría-,
# sino HTML válido sin tarjetas, así que el pipeline lo lee como "no hay más
# resultados", corta limpio y termina en `success` sin traer nada. Comprobado
# el 2026-10-17: el mismo código, a la misma hora, desde una IP residencial
# devuelve 48 avisos por página (59 de 96 sin registrar en la base), mientras
# la corrida #445 desde Actions recorrió 100 páginas y las encontró todas
# vacías.
#
# El `schedule` queda comentado en vez de borrado para poder reactivarlo tal
# cual. `workflow_dispatch` se mantiene: permite correrlo a mano para
# comprobar si el bloqueo se levantó.
#
# Para retomar hay que resolver primero el origen de la petición: un
# self-hosted runner con IP residencial, una tarea programada local, o un
# proxy residencial. Reactivar el cron sin eso solo acumula corridas vacías.
on:
  # schedule:
  #   - cron: '0 */4 * * *'   # 6 corridas al día, en punto (UTC)
  workflow_dispatch:         # permite correrlo manualmente desde la pestaña Actions

# Ya no se pushea nada al repo (la BD vive en Supabase) - explícito solo
# lectura en vez de heredar el default de permisos de GITHUB_TOKEN del repo.
permissions:
  contents: read

concurrency:
  group: orquestador-produccion
  cancel-in-progress: false

jobs:
  ejecutar-orquestador:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r produccion/01_modelo_produccion/requirements.txt

      - name: Correr orquestador
        env:
          BD_STRING: ${{ secrets.BD_STRING }}
        run: |
          python produccion/01_modelo_produccion/00_orquestador.py
