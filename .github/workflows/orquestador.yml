name: Orquestador cada 4h - Producción

# PAUSADO 2026-08-09: portalinmobiliario.com empezó a exigir sesión
# autenticada (muro "negative_traffic" en /gz/account-verification) para
# cualquier request sin cookies de navegador real, incluso la portada. Desde
# el 2026-08-05 esto hizo que 02_scraper_detalle_incremental.py marcara en
# masa avisos activos como 'no_disponible' (falso positivo: interpretaba el
# muro como "el aviso fue eliminado"). Se deshabilita el cron hasta resolver
# la forma de scrapear el sitio; el trigger manual (workflow_dispatch) queda
# para poder retomar a mano cuando corresponda.
on:
  workflow_dispatch:         # permite correrlo manualmente desde la pestaña Actions

# Ya no se pushea nada al repo (la BD vive en Supabase) - explícito solo
# lectura en vez de heredar el default de permisos de GITHUB_TOKEN del repo.
permissions:
  contents: read

concurrency:
  group: orquestador-produccion
  cancel-in-progress: false

jobs:
  ejecutar-orquestador:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r produccion/01_modelo_produccion/requirements.txt

      - name: Correr orquestador
        env:
          BD_STRING: ${{ secrets.BD_STRING }}
        run: |
          python produccion/01_modelo_produccion/00_orquestador.py
