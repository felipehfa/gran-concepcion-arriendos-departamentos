name: Orquestador cada 4h - Producción

# REACTIVADO 2026-08-10: el muro "negative_traffic" en /gz/account-verification
# que forzó la pausa del 2026-08-09 ya no está activo (confirmado en vivo).
# Antes de reactivar se corrigió la causa de fondo del incidente: un mismatch
# de canonical/og:url ya no se interpreta como "el aviso fue eliminado" de
# inmediato - ahora se detecta aparte si el sitio está redirigiendo TODO el
# tráfico al muro (resultado "bloqueado" en scrapers_base/02_scraper_detalle.py),
# lo que corta la corrida sin tocar estado_publicacion, y el resto de los
# mismatches pasan por el contador intentos_fallidos_detalle en vez de
# marcarse de inmediato (ver 02_scraper_detalle_incremental.py). Si el sitio
# vuelve a bloquear, esto ya no debería poder vaciar la base de nuevo.
on:
  schedule:
    - cron: '0 */4 * * *'   # 6 corridas al día, en punto (UTC)
  workflow_dispatch:         # permite correrlo manualmente desde la pestaña Actions

# Ya no se pushea nada al repo (la BD vive en Supabase) - explícito solo
# lectura en vez de heredar el default de permisos de GITHUB_TOKEN del repo.
permissions:
  contents: read

concurrency:
  group: orquestador-produccion
  cancel-in-progress: false

jobs:
  ejecutar-orquestador:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r produccion/01_modelo_produccion/requirements.txt

      - name: Correr orquestador
        env:
          BD_STRING: ${{ secrets.BD_STRING }}
        run: |
          python produccion/01_modelo_produccion/00_orquestador.py
